<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 속성 : 전역속성 
        1) name
        2) class
        3) id
        4) style
        5) data-*
    -->
    <p style="" class="" id="" name="" data-content="">
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Culpa quod
      accusamus, totam atque dignissimos illo earum sed vitae? Provident sint
      veritatis quidem tempora inventore iste quas voluptas nam dolorem rem!
    </p>
    <!-- 인라인 vs 블럭 => 요소가 배치되는 방식 
        인라인 : 옆으로 배치되는 요소 => label, input, span, a etc
        블록 : 하나의 행을 다 쓰는 => div, p etc
        -->
    <div><a href="#">네이버</a></div>
    <a href="#">구글</a>
    <a href="#">다음</a>
    <form action="">
      <div>
        <label for="">이름</label>
        <input type="radio" name="" id="" />
      </div>
      <div>
        <label for="">전화번호</label>
        <input type="text" name="" id="" />
      </div>
    </form>
  </body>
</html>
