<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
      }
      div {
        width: 100px;
        height: 100px;
        background: tomato;
        padding: 20px;
        border: 2px solid black;
      }
    </style>
  </head>
  <body>
    <!-- 요소의 크기 
        요소(width + height) + padding + border

        box-sizing : border-box; 보더까지 포함해서 사이즈 잡아주는
        
        content-box: w,h 크기는 content만 적용 + padding + border 
    -->
    <div></div>
  </body>
</html>
