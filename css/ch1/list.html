<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      ul {
        list-style: square inside;
      }

      ul > li:first-child {
        list-style: "★";
      }
      ol {
        list-style: none;
      }
    </style>
  </head>
  <body>
    <!-- 
        리스트 스타일
        list-style : 한꺼번에 주는 방식 type | position | image
        개별로 주는 방식
        list-style-type
        list-style-position
        list-style-image
        
        ul : disc(default), circle, square
        ol : alpha, roman, decimal(default)
        
    -->
    <ul>
      <li>리스트 아이템1</li>
      <li>리스트 아이템2</li>
      <li>리스트 아이템3</li>
      <li>리스트 아이템4</li>
      <li>리스트 아이템5</li>
    </ul>
    <ol>
      <li>리스트 아이템1</li>
      <li>리스트 아이템1</li>
      <li>리스트 아이템1</li>
      <li>리스트 아이템1</li>
      <li>리스트 아이템1</li>
    </ol>
  </body>
</html>
