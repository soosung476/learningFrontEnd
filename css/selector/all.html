<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      /* 선택자
            1) 태그 선택자
            2) 아이디 선택자
            3) 클래스 선택자

      div * {
        /* background-color: bisque; */
        color: orange;
      }
      .color {

      }
      .line {
        text-decoration: underline;
      }
      .weight {
        font-weight: bold;
      }
      .color {
        color: olivedrab;
      }
    </style>
    <title>Document</title>
  </head>

    <!-- 전역속성 이용 : id, class -->
    <div>
      <h1 id="title">css 선택자</h1>
      <h1>css 선택자2</h1>
    </div>

    <!-- p.contetnts>lorem -->
    <ul>
      <li class="color">list Item</li>
      <li class="color line">list Item2</li>
      <li class="color line weight">list Item3</li>
    </ul>
  </body>
</html>
