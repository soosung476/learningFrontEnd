<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      /* 선택자
            1) 태그 선택자
            2) 아이디 선택자
            3) 클래스 선택자
            4) 전체선택자 *
            5) 자손 선택자 : 공백
            6) 자식 선택자 : >
            7) 인접형제 선택자 : +(뒤에 따라나오는 첫번째 요소만) or ~(뒤에 따라나오는 모든 요소)
            8) 그룹화
            9) 속성 선택자 : [속성명^=값] : 값으로 시작하는
              [속성명$=값] : 값으로 끝나는
              [속성명]
              [속성명 *=값] : 값이 포함된
            10) 가상 클래스 선택자
             a : 밑줄, 파란색 
                active : 빨강색
                visited : 보라색


              :hover : 요소에 마우스 올려놨을 때
              :checked, :disabled

            11) 가상 요소 선택자
            ::after, ::before

            12) 구조 선택자
            :first-child, :last-child, :nth-child()
            :first-of-type :last-of-type :nth-of-type()


            13) not(선택자) : 해당 선택자가 아닌
        */
      #title,
      nav #title2 {
        color: brown;
      }
      a:link {
        text-decoration: none;
        color: black;
      }

      a:visited {
        color: black;
      }

      #title:hover {
        background-color: orange;
      }
      .box {
        width: 100px;
        height: 100px;
        background-color: aquamarine;
      }
      .box:hover {
        width: 200px;
      }

      /* a[target="_blank"] {
        color: red;
      }
      [class$="name"] {
        background-color: aquamarine;
      }
      [class*="line"] {
        background-color: aquamarine;
      } */
    </style>

    <title>Document</title>
  </head>
  <body>
    <!-- 전역속성 이용 : id, class -->
    <div>
      <h1 id="title">css 선택자</h1>
      <h2 class="fruit_name">형제 선택자1</h2>
      <h2>형제 선택자2</h2>
    </div>
    <div class="box"></div>

    <!-- p.contetnts>lorem -->
    <ul>
      <li class="color">list Item</li>
      <li class="color line">list Item2</li>
      <li class="color line weight">list Item3</li>
    </ul>
    <nav>
      <h1 id="title2">css 선택자</h1>
      <h1>css 선택자2</h1>
    </nav>
    <ul>
      <li><a href="https://www.naver.com">naver</a></li>
      <li><a href="https://daum.net" target="_blank">daum</a></li>
    </ul>
  </body>
</html>
