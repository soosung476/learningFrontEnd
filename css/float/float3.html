<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        background-color: white;
      }
      img:first-child {
        float: left;
      }
      img:nth-child(2) {
        float: right;
      }
      p {
        clear: both;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="../data/left-arrow.png" alt="" />
      <img src="../data/right-arrow.png" alt="" />
      <p>
        Lorem ipsum dolor, sit amet consectetur adipisicing elit. Animi aliquid
        obcaecati aperiam qui tempore quibusdam nihil dolore repellendus sunt
        nesciunt esse fugiat odio necessitatibus non voluptatum quidem, labore
        enim! Tenetur?
      </p>
    </div>
  </body>
</html>
