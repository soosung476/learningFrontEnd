<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Light</h1>
    <div>
      <button type="button">Turn on the light</button>
      <img src="./data/pic_bulboff.gif" alt="" />
      <button type="button">Turn off the light</button>
    </div>
    <script>
      const div = document.querySelector("div");
      const img = document.querySelector("img");
      div.addEventListener("click", (e) => {
        if (e.target.innerText === "Turn on the light") {
          img.src = "./data/pic_bulbon.gif";
        } else if (e.target.innerText === "Turn off the light") {
          img.src = "./data/pic_bulboff.gif";
        }
      });
    </script>
  </body>
</html>
