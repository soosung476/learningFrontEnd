<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      div * {
        padding: 10px;
        margin: 10px;
      }
      [read-only] {
        background-color: lightgray;
      }
    </style>
  </head>
  <body>
    <h2>숫자 맞추기</h2>
    <p>
      컴퓨터가 생성한 숫자를 맞추는 게임입니다 <br />
      숫자는 1~100 사이에 있습니다.
    </p>
    <div>
      <label for="num1">숫자</label>
      <input type="text" name="num1" id="num1" size="5" />
      <button type="button">확인</button>
    </div>
    <div>
      <label for="count">추측횟수</label>
      <input type="text" name="count" id="count" size="5" readonly />
    </div>
    <div>
      <label for="hint">힌트</label>
      <input type="text" name="hint" id="hint" readonly />
    </div>

    <script>
      // 1~100 임의의 수 생성
      // 확인버튼 누르면 추측횟수 ++1
      // 사용자가 입력한 값보다 실제 값이 크면 추측값이 작다, 작으면 추측값이 크다 힌트에 집어넣음
      // 맞추면 버튼 비활성화
      let number1 = Math.floor(Math.random() * 100 + 1);
      let counter = 0;
      const count = document.querySelector("#count");
      const btn = document.querySelector("button");
      const inputnumber = document.querySelector("#num1");
      const hint = document.querySelector("#hint");
      btn.addEventListener("click", (e) => {
        counter++;
        count.value = counter;
        if (inputnumber.value == number1) {
          btn.disabled = true;
          hint.value = "정답입니다.";
        } else if (Number(inputnumber.value) > number1) {
          hint.value = "추측한 크기가 큽니다.";
        } else {
          hint.value = "추측한 크기가 작습니다.";
        }
      });
    </script>
  </body>
</html>
